name: CFD evidence checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # CFD-15: the CFD-3 search-boundary register checker reads only committed public files
  # (the register and the documents it quotes). It fails the build when a cited document no
  # longer contains a quoted statement, or when the committed result no longer matches a fresh run.
  cfd3_boundary_register:
    name: cfd/cfd3-boundary-register
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test the CFD-3 boundary register checker
        run: python -B -m unittest discover -s docs/tools -p 'test_check_cfd3_boundary_register.py' -v
      - name: Re-run the checker and compare with the committed result
        run: |
          fresh="$RUNNER_TEMP/cfd3_boundary_register_check_results.json"
          committed="docs/feasibility/cfd3_boundary_register_check_results.json"
          set +e
          python -B docs/tools/check_cfd3_boundary_register.py \
            --register docs/feasibility/search_boundary_register.json \
            --root . \
            --output "$fresh"
          status=$?
          set -e
          cat "$fresh"
          if [ "$status" -ne 0 ]; then
            echo "::error::CFD-3 boundary register check failed on the committed register and cited files"
            exit 1
          fi
          if ! cmp -s "$committed" "$fresh"; then
            echo "::error::$committed does not match a fresh run; regenerate it from a real run"
            diff -u "$committed" "$fresh" || true
            exit 1
          fi
