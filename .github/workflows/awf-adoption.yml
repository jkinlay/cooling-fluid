name: AWF adoption checks

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned AWF dependencies
        run: 'python -m pip install --require-hashes --only-binary=:all: -r .agentic/requirements.lock'
      - name: Verify AWF installation
        run: python -B -I .agentic/scripts/workflow.py verify-installation
      - name: Validate AWF configuration
        run: python -B -I .agentic/scripts/workflow.py validate-config
      - name: Validate planning package
        run: python -B docs/tools/validate_specification_package.py